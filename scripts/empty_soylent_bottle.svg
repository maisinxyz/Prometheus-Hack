            <path class="outline" fill="#F5F5F5" d="M 210 120 L 290 120 Q 320 180 340 220 L 340 420 Q 340 450 310 450 L 190 450 Q 160 450 160 420 L 160 220 Q 180 180 210 120 Z" />
