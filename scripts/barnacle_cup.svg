      .outline { stroke: #1a1a1a; stroke-width: 8; stroke-linejoin: round; stroke-linecap: round; }
    </style>
  </defs>

        <g transform="translate(0, 30)">
            <!-- Straw -->
            <path class="outline" fill="#DC143C" stroke-width="12" d="M 280 80 L 230 150" />
            
