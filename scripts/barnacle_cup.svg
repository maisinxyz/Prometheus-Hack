            <path class="shadow" d="M 170 160 L 220 160 Q 200 300 210 410 L 170 410 Z" />
            
            <!-- Crumple Lines -->
            <path fill="none" stroke="#B0C4DE" stroke-width="4" d="M 180 200 Q 220 220 200 280" />
